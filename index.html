<title>Movitek Madrid · WhatsApp</title>
<style>
:root{--bg:#FFE98B;--ink:#2A0D35;--card:#FFF8DA;--accent:#2A0D35;--accentink:#FFE98B;--muted:#5B3F6B;--wa:#25D366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A0D35;--ink:#FFE98B;--card:#3B1B4B;--accent:#FFE98B;--accentink:#2A0D35;--muted:#CDB8E6}}
:root[data-theme="dark"]{--bg:#2A0D35;--ink:#FFE98B;--card:#3B1B4B;--accent:#FFE98B;--accentink:#2A0D35;--muted:#CDB8E6}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 36px}
.logo{display:block;margin:6px auto 4px;width:84px;height:auto}
.logo.y{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.d{display:none}:root:not([data-theme="light"]) .logo.y{display:block}}
:root[data-theme="dark"] .logo.d{display:none}:root[data-theme="dark"] .logo.y{display:block}
h1{font-size:26px;margin:4px 0 0;text-align:center;font-weight:700}
.tag{text-align:center;letter-spacing:.35em;font-size:11px;font-weight:600;margin:2px 0 14px}
.lang{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.lang button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
.q{text-align:center;font-size:15px;margin:0 0 14px;color:var(--muted)}
.grid{display:grid;gap:10px}
a.opt{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border-radius:16px;padding:14px 16px;border:2px solid transparent;box-shadow:0 1px 0 rgba(0,0,0,.08)}
a.opt:active{transform:scale(.98)}
.ic{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.t b{display:block;font-size:15px;line-height:1.25}.t span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.go{margin-left:auto;font-size:20px;font-weight:700}
a.main{background:var(--wa);color:#073b1d;justify-content:center;font-weight:700;font-size:16px;padding:16px;margin-bottom:14px;border-radius:999px;text-decoration:none;display:flex;gap:10px;align-items:center}
.foot{margin-top:20px;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.foot a{color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;margin-top:14px}
.row a{flex:1;text-align:center;text-decoration:none;color:var(--accentink);background:var(--accent);border-radius:999px;padding:11px 8px;font-weight:600;font-size:13px}
</style></head><body><div class="wrap">
